<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private Cookie Export</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body>
  <header><img src="icon.svg" width="34" height="34" alt=""><h1>Private Cookie Export</h1></header>
  <p id="status" role="status" aria-live="polite">현재 탭을 확인하고 있습니다.</p>
  <p id="scope" hidden></p>
  <button id="prepare" type="button" hidden>쿠키 파일 준비</button>
  <p id="summary" aria-live="polite" hidden></p>
  <a id="download" class="download" hidden>파일 저장</a>
  <button id="close" class="secondary" type="button" hidden>다운로드 확인 후 탭 닫기</button>
  <p class="small">계정 접근에 사용할 수 있는 평문 파일입니다. 필요한 도구에서 사용한 뒤 지우세요.</p>
  <details><summary>파일 내용과 권한</summary>
    <p>쿠키마다 적용 주소·경로·만료·이름·값을 저장합니다. 호환 도구가 기존 세션을 사용할 때만 필요합니다.</p>
    <p><a href="privacy.html" target="_blank" rel="noopener">항목 뜻과 소스 검증 방법</a></p>
    <button id="revoke" type="button" hidden>이 사이트 권한 해제</button>
  </details>
</body>
</html>
