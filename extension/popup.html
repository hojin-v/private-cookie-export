<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private Cookie Export</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body>
  <header><img src="icon.svg" width="34" height="34" alt=""><h1>Private Cookie Export</h1></header>
  <p id="status" role="status" aria-live="polite" data-message="checking"></p>
  <p id="scope" hidden></p>
  <button id="prepare" type="button" data-message="prepare" hidden></button>
  <p id="summary" aria-live="polite" hidden></p>
  <a id="download" class="download" data-message="saveFile" hidden></a>
  <button id="close" class="secondary" type="button" data-message="closeAfterDownload" hidden></button>
  <p class="small" data-message="fileWarning"></p>
  <details><summary data-message="instructions"></summary>
    <ol>
      <li data-message="stepPrivate"></li><li data-message="stepTab"></li>
      <li data-message="stepPrepare"></li><li data-message="stepSave"></li>
    </ol>
  </details>
  <details><summary data-message="privacyHeading"></summary>
    <p data-message="popupContents"></p>
    <p><a href="privacy.html" target="_blank" rel="noopener" data-message="detailsLink"></a></p>
    <button id="revoke" type="button" data-message="revokeSite" hidden></button>
  </details>
</body>
</html>
